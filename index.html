<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بريد الدرر 🤍🌸🪐</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .banner {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .banner img {
            width: 100%;
            display: block;
        }
        .card {
            background-color: #161616;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid #222;
            text-align: center;
        }
        h2 { 
            color: #ffffff; 
            margin-top: 0;
            font-size: 24px;
        }
        .emojis {
            font-size: 20px;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 15px;
            text-align: right;
        }
        textarea:focus {
            border-color: #555;
            outline: none;
        }
        .file-label {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #b3b3b3;
            margin-bottom: 8px;
        }
        input[type="file"] {
            width: 100%;
            margin-bottom: 20px;
            color: #888;
            font-size: 14px;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }
        button:hover { 
            background-color: #e6e6e6; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- غلاف الواجهة العلوية بالصورة المطلوبة -->
        <div class="banner">
            <img src="https://google.com" alt="غلاف الاستفتاء">
        </div>

        <!-- صندوق الإرسال الداكن -->
        <div class="card">
            <h2>بريد الدرر</h2>
            <div class="emojis">🤍 🌸 🪐</div>
            
            <form>
                <textarea placeholder="اكتب رسالتك هنا..."></textarea>
                <span class="file-label">أرفق صورة إن أحببت:</span>
                <input type="file" accept="image/*">
                <button type="button">إرسال</button>
            </form>
        </div>
    </div>

</body>
</html>
